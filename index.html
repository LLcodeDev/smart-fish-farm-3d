<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐟</text></svg>">
  <title>智慧大棚水产养殖3D仿真</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1a2e; font-family: 'Microsoft YaHei', Arial, sans-serif; }
    canvas { display: block; }
    #hint {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.6); font-size: 14px;
      background: rgba(0,0,0,0.4); padding: 8px 16px; border-radius: 8px;
      pointer-events: none; white-space: nowrap;
    }
    /* ===== 左侧控制面板 ===== */
    #dashboard {
      position: absolute; top: 10px; left: 10px; width: 260px;
      background: rgba(10,15,30,0.85); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px; padding: 14px; color: #ddd; font-size: 13px;
      max-height: calc(100vh - 20px); overflow-y: auto; z-index: 20;
      backdrop-filter: blur(10px);
    }
    #dashboard h2 { font-size: 15px; color: #fff; margin-bottom: 10px; text-align: center; }
    #dashboard .section { margin-bottom: 10px; padding: 8px 10px; background: rgba(255,255,255,0.05); border-radius: 8px; }
    #dashboard .section h3 { font-size: 12px; color: #8af; margin-bottom: 6px; }
    #dashboard .info-row { display: flex; justify-content: space-between; margin: 3px 0; font-size: 12px; }
    #dashboard .badge {
      display: inline-block; padding: 1px 6px; border-radius: 4px;
      font-size: 11px; font-weight: bold;
    }
    .badge.idle { background: #555; color: #aaa; }
    .badge.moving { background: #2979ff; color: #fff; }
    .badge.feeding { background: #00c853; color: #fff; }
    .badge.refill { background: #ff9100; color: #fff; }
    .badge.charging { background: #ffd600; color: #333; }
    .badge.done { background: #00e676; color: #003300; }
    .badge.waiting { background: #7c4dff; color: #fff; }
    .badge.shutdown { background: #000; color: #f00; }
    .badge.returning { background: #ff6d00; color: #fff; }
    .battery-low { color: #ff5252; }
    .battery-ok { color: #69f0ae; }
    /* ===== 任务列表 ===== */
    #task-list { list-style: none; padding: 0; margin: 0; }
    #task-list li {
      display: flex; justify-content: space-between; align-items: center;
      padding: 3px 6px; margin: 2px 0; background: rgba(255,255,255,0.05); border-radius: 4px;
      font-size: 11px;
    }
    #task-list li .task-del {
      cursor: pointer; color: #ff5252; font-size: 11px; line-height: 1; padding: 2px 6px; border-radius: 3px; background: rgba(255,50,50,0.1);
    }
    #task-list li .task-del:hover { background: rgba(255,50,50,0.3); }
    /* ===== 添加任务表单 ===== */
    #add-task-form { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
    #add-task-form .row { display: flex; gap: 4px; }
    #add-task-form input, #add-task-form select {
      background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px; padding: 4px 6px; color: #fff; font-size: 12px; flex: 1; min-width: 0;
    }
    #add-task-form button {
      background: #2979ff; border: none; border-radius: 4px; padding: 4px 10px;
      color: #fff; cursor: pointer; font-size: 12px; white-space: nowrap;
    }
    #add-task-form button:hover { background: #448aff; }
    .cart-status-icon { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    .cart-status-icon.idle { background: #555; }
    .cart-status-icon.moving { background: #2979ff; }
    .cart-status-icon.feeding { background: #00c853; }
    .cart-status-icon.refill { background: #ff9100; }
    .cart-status-icon.charging { background: #ffd600; }
    .cart-status-icon.waiting { background: #7c4dff; }
    .cart-status-icon.shutdown { background: #ff1744; }
    .cart-status-icon.returning { background: #ff6d00; }
    /* ===== 滚动条 ===== */
    #dashboard::-webkit-scrollbar { width: 4px; }
    #dashboard::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
    /* ===== 全局时钟 ===== */
    #sim-time { font-size: 13px; font-weight: bold; color: #fff; text-align: center; margin-bottom: 6px; }
    #sim-speed-control { display: flex; gap: 4px; align-items: center; margin-top: 4px; }
    #sim-speed-control input { flex: 1; }
    #sim-speed-control label { font-size: 11px; color: #aaa; white-space: nowrap; }
    /* ===== 任务总量统计 ===== */
    #stats { display: flex; justify-content: space-around; margin: 4px 0; font-size: 11px; }
    #stats span { text-align: center; }
    #stats .num { color: #fff; font-weight: bold; }
    /* ===== 阈值设置 ===== */
    #thresholds-toggle { cursor: pointer; font-size: 11px; color: #8af; user-select: none; }
    #thresholds-toggle:hover { color: #abf; }
    #thresholds-panel { margin-top: 4px; }
    #thresholds-panel .slider-row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
    #thresholds-panel .slider-row label { font-size: 11px; color: #aaa; white-space: nowrap; min-width: 50px; }
    #thresholds-panel .slider-row input[type="range"] { flex: 1; }
    #thresholds-panel .slider-row .val { font-size: 11px; color: #fff; min-width: 32px; text-align: right; }
    /* ===== 选中鱼塘信息 ===== */
    #pond-info { font-size: 11px; color: #aaa; display: none; }
    #pond-info.show { display: block; }
  </style>
</head>
<body>
  <!-- 左侧控制面板 -->
  <div id="dashboard">
    <h2>智慧投喂调度</h2>
    <div id="sim-time" style="text-align:center;">--:--:--</div>

    <!-- 统计 -->
    <div id="stats">
      <span>任务 <span id="task-count" class="num">0</span></span>
      <span>已喂 <span id="fed-count" class="num">0</span>/20</span>
      <span>倍速 <span id="sim-speed-display" class="num">1x</span></span>
    </div>

    <!-- 时间调节 -->
    <div style="display:flex; gap:4px; align-items:center; margin-bottom:6px; font-size:11px;">
      <span style="color:#aaa; white-space:nowrap;">时间</span>
      <button id="time-hh-down" style="background:rgba(255,255,255,0.1); border:none; border-radius:3px; color:#ccc; cursor:pointer; padding:1px 6px; font-size:12px;">H-</button>
      <span id="sim-time-num" style="color:#fff; font-weight:bold; font-size:13px; min-width:60px; text-align:center;">--:--</span>
      <button id="time-hh-up" style="background:rgba(255,255,255,0.1); border:none; border-radius:3px; color:#ccc; cursor:pointer; padding:1px 6px; font-size:12px;">H+</button>
      <button id="time-mm-up" style="background:rgba(255,255,255,0.1); border:none; border-radius:3px; color:#ccc; cursor:pointer; padding:1px 6px; font-size:12px;">M+</button>
      <button id="time-mm-down" style="background:rgba(255,255,255,0.1); border:none; border-radius:3px; color:#ccc; cursor:pointer; padding:1px 6px; font-size:12px;">M-</button>
    </div>

    <!-- 小车状态 -->
    <div class="section">
      <h3>小车状态</h3>
      <div id="cart1-info"><div class="info-row"><span>小车1</span><span class="badge idle">加载中...</span></div></div>
      <div id="cart2-info"><div class="info-row"><span>小车2</span><span class="badge idle">加载中...</span></div></div>
    </div>

    <!-- 任务队列 -->
    <div class="section" style="max-height:180px; overflow-y:auto;">
      <h3>任务队列</h3>
      <ul id="task-list"></ul>
      <div style="text-align:right; margin-top:4px;">
        <button id="btn-clear-tasks" style="background:#ff5252; border:none; border-radius:4px; padding:2px 8px; color:#fff; cursor:pointer; font-size:11px;">清空所有</button>
      </div>
      <div id="add-task-form">
        <div class="row">
          <div style="display:flex; align-items:center; gap:4px; flex:0.7;">
            <input type="number" id="task-tank" placeholder="桶号 1-20" min="1" max="20" value="1" style="flex:1; min-width:0;">
            <span style="color:#aaa; font-size:11px; white-space:nowrap;">号桶</span>
          </div>
          <div style="display:flex; align-items:center; gap:4px; flex:1;">
            <input type="number" id="task-amount" placeholder="投喂量" min="0.1" max="50" step="0.5" value="2" style="flex:1; min-width:0;">
            <span style="color:#aaa; font-size:11px; white-space:nowrap;">kg</span>
          </div>
        </div>
        <div class="row">
          <select id="task-cart" style="flex:0.5"><option value="0">任意小车</option><option value="1">小车1</option><option value="2">小车2</option></select>
          <div style="flex:0.3; display:flex; align-items:center; gap:2px;">
            <input type="number" id="task-interval" placeholder="间隔" min="0" max="168" step="0.5" value="6" style="width:100%; background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.15); border-radius:4px; padding:4px 2px; color:#fff; font-size:11px; text-align:center;">
            <span style="color:#aaa; font-size:10px;">h</span>
          </div>
          <button id="btn-add-task" style="flex:0.35;">+ 添加</button>
        </div>
      </div>
    </div>

    <!-- 速度控制 -->
    <div class="section" style="padding:6px 10px;">
      <div id="sim-speed-control">
        <label>模拟速度</label>
        <input type="range" id="speed-slider" min="0.1" max="5" step="0.1" value="1">
        <label id="speed-label">1x</label>
      </div>
    </div>

    <!-- 操作按钮 -->
    <div class="section" style="display:flex; gap:4px; padding:6px 10px;">
      <button id="btn-start-sim" style="flex:1; background:#00c853; border:none; border-radius:6px; padding:6px; color:#fff; cursor:pointer; font-size:12px;">开始投放</button>
      <button id="btn-pause-sim" style="flex:1; background:#ff9100; border:none; border-radius:6px; padding:6px; color:#fff; cursor:pointer; font-size:12px;">暂停</button>
      <button id="btn-reset-sim" style="flex:1; background:#ff5252; border:none; border-radius:6px; padding:6px; color:#fff; cursor:pointer; font-size:12px;">重置</button>
    </div>

    <!-- 小车阈值设置 -->
    <div class="section" style="padding:6px 10px;">
      <div id="thresholds-toggle">&#9654; 小车阈值设置</div>
      <div id="thresholds-panel" style="display:none;">
        <div class="slider-row">
          <label>充电电量</label>
          <input type="range" id="th-battery" min="5" max="50" value="10" step="1">
          <span class="val" id="th-battery-val">10%</span>
        </div>
        <div class="slider-row">
          <label>补料余粮</label>
          <input type="range" id="th-feed" min="1" max="30" value="5" step="0.5">
          <span class="val" id="th-feed-val">5kg</span>
        </div>
        <div class="slider-row">
          <label>双低补料</label>
          <input type="range" id="th-feed-lowbatt" min="1" max="30" value="10" step="0.5">
          <span class="val" id="th-feed-lowbatt-val">10kg</span>
        </div>
      </div>
    </div>

    <!-- 鱼塘数据面板 -->
    <div class="section" style="padding:6px 10px;">
      <div id="pond-data-toggle" style="cursor:pointer; font-size:11px; color:#8af; user-select:none;">&#9654; 鱼塘数据面板</div>
      <div id="pond-data-panel" style="display:none; margin-top:6px;">
        <div style="display:flex; align-items:center; gap:4px; margin-bottom:6px;">
          <input type="text" id="pond-search" placeholder="搜索桶号或鱼数..." style="flex:1; background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.15); border-radius:4px; padding:4px 6px; color:#fff; font-size:11px;">
          <span style="color:#aaa; font-size:10px; white-space:nowrap;">显示 <span id="pond-show-count">0</span>/20</span>
        </div>
        <div style="max-height:260px; overflow-y:auto;" id="pond-table-wrap">
          <table style="width:100%; font-size:10px; border-collapse:collapse; color:#ccc;">
            <thead>
              <tr style="color:#8af; position:sticky; top:0; background:rgba(10,15,30,0.95);">
                <th style="padding:2px 4px; text-align:left;">桶</th>
                <th style="padding:2px 4px; text-align:center;">鱼</th>
                <th style="padding:2px 4px; text-align:center;">水质</th>
                <th style="padding:2px 4px; text-align:center;">上次投喂</th>
                <th style="padding:2px 4px; text-align:right;">量</th>
              </tr>
            </thead>
            <tbody id="pond-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="hint">鼠标拖拽旋转 · 滚轮缩放 · WASD 移动 · Shift 加速 · Q/E 升降 · 点击鱼塘查看详情</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="/main.js"></script>
</body>
</html>
